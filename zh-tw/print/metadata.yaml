---
title-meta: 從零開始學 Rust
author-meta: Andy Shiue
lang: zh-TW
documentclass: book
has-frontmatter: false
classoption:
  - twoside
  - openany
papersize: a4
fontsize: 11pt
toc-title: 目錄
colorlinks: false
mainfont: Noto Sans
sansfont: Noto Sans
monofont: JetBrains Mono
monofontoptions:
  - Scale=0.92
  # Disable JetBrains Mono ligatures. Sequences such as :::, ->, =>, and !=
  # would merge into glyphs without correct PDF Unicode mappings, corrupting
  # search and copied text into sequences such as ^: and ^>.
  # RawFeature={...} cannot be used because Pandoc escapes metadata braces.
  - Contextuals=AlternateOff
  - Ligatures=CommonOff
  # Use Medium because Regular is too light in print.
  - UprightFont=* Medium
  - ItalicFont=* Medium Italic
  - BoldFont=* Bold
  - BoldItalicFont=* Bold Italic
geometry:
  - a4paper
  - inner=24mm
  - outer=18mm
  - top=20mm
  - bottom=24mm
  - headheight=14pt
  - headsep=8mm
---
