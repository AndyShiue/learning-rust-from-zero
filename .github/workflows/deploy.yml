name: deployment
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Keep CI reproducible; update these pins deliberately when new releases
  # have been checked against both editions.
  RUST_VERSION: "1.98.0"
  RUSTUP_TOOLCHAIN: "1.98.0"
  MDBOOK_VERSION: "0.5.4"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check bilingual source mirror
        run: python3 scripts/check_bilingual_mirror.py

      - name: Install Rust, mdBook, and PDF dependencies
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          cargo install mdbook --version "$MDBOOK_VERSION" --locked
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-lang-chinese \
            texlive-fonts-recommended \
            fonts-jetbrains-mono \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-symbola

      - name: Prepare shared book resources
        run: |
          python3 -B scripts/prepare_mdbook_assets.py
          cargo build --manifest-path test-deps/Cargo.toml
          mkdir -p build/fonts
          curl -L --fail --retry 3 --retry-delay 2 \
            --output build/fonts/NotoSansCJKtc-Regular.otf \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf
          curl -L --fail --retry 3 --retry-delay 2 \
            --output build/fonts/NotoSansCJKtc-Bold.otf \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Bold.otf
          curl -L --fail --retry 3 --retry-delay 2 \
            --output build/fonts/NotoSansMonoCJKtc-Regular.otf \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/Mono/NotoSansMonoCJKtc-Regular.otf

      - name: Build Traditional Chinese edition
        working-directory: zh-TW
        run: |
          mdbook test -L ../test-deps/target/debug/deps
          mdbook build
          bash ../scripts/build_print.sh zh-TW
          cp book/rust-book-a4.pdf book/book.pdf
          (cd src && zip -r ../book/rust-book-src.zip .)

      - name: Build English edition
        working-directory: en
        run: |
          mdbook test -L ../test-deps/target/debug/deps
          mdbook build
          python3 scripts/check_pdf_code_lines.py
          bash ../scripts/build_print.sh en
          cp book/rust-book-a4.pdf book/book.pdf
          (cd src && zip -r ../book/rust-book-src.zip .)

      - name: Assemble multilingual site
        run: |
          rm -rf public
          mkdir -p public
          cp index.html public/index.html
          cp favicon.svg public/favicon.svg
          cp 404.html public/404.html
          cp robots.txt public/robots.txt
          cp -r zh-TW/book public/zh-TW
          cp -r en/book public/en

      - name: Generate SEO metadata and sitemap
        run: |
          python3 scripts/normalize_public_urls.py public
          python3 scripts/add_seo_metadata.py public
          python3 scripts/generate_sitemap.py public

      - name: Add IndexNow verification file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [[ ! "$INDEXNOW_KEY" =~ ^[A-Za-z0-9-]{8,128}$ ]]; then
            echo "INDEXNOW_KEY is missing or invalid" >&2
            exit 1
          fi
          printf '%s' "$INDEXNOW_KEY" > "public/${INDEXNOW_KEY}.txt"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Submit changed URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: >-
          python3 scripts/submit_indexnow.py public
          --before "${{ github.event.before }}"
          --after "${{ github.sha }}"
