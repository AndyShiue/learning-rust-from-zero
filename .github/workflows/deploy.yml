name: deployment
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust, mdBook, and PDF dependencies
        run: |
          rustup update stable
          cargo install mdbook
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-lang-chinese \
            texlive-fonts-recommended \
            fonts-jetbrains-mono \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-symbola

      - name: Prepare shared book resources
        run: |
          cargo build --manifest-path test-deps/Cargo.toml
          mkdir -p build/fonts
          curl -L --fail --retry 3 --retry-delay 2 \
            --output build/fonts/NotoSansCJKtc-Regular.otf \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf
          curl -L --fail --retry 3 --retry-delay 2 \
            --output build/fonts/NotoSansCJKtc-Bold.otf \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Bold.otf
          curl -L --fail --retry 3 --retry-delay 2 \
            --output build/fonts/NotoSansMonoCJKtc-Regular.otf \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/Mono/NotoSansMonoCJKtc-Regular.otf

      - name: Build Traditional Chinese edition
        working-directory: zh-TW
        run: |
          mdbook test -L ../test-deps/target/debug/deps
          mdbook build
          bash ./print/build.sh
          cp book/rust-book-a4.pdf book/book.pdf
          (cd src && zip -r ../book/rust-book-src.zip .)

      - name: Build English edition
        working-directory: en
        run: |
          mdbook test -L ../test-deps/target/debug/deps
          mdbook build
          python3 scripts/check_pdf_code_lines.py
          bash ./print/build.sh
          cp book/rust-book-a4.pdf book/book.pdf
          (cd src && zip -r ../book/rust-book-src.zip .)

      - name: Assemble multilingual site
        run: |
          rm -rf public
          mkdir -p public
          cp index.html public/index.html
          cp 404.html public/404.html
          cp -r zh-TW/book public/zh-TW
          cp -r en/book public/en

      - name: Generate sitemap
        run: python3 scripts/generate_sitemap.py public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
